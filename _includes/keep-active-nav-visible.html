<script>
document.addEventListener("DOMContentLoaded", () => {
  const chineseNav = document.querySelector(".zh-site-navbar");
  const chineseMenuButton = document.querySelector(".zh-menu-toggle");

  if (chineseNav && chineseMenuButton) {
    const pageContent = document.querySelector("#quarto-content");
    if (pageContent && chineseNav.parentElement !== document.body) {
      document.body.insertBefore(chineseNav, pageContent);
    }

    chineseMenuButton.addEventListener("click", () => {
      const isOpen = chineseNav.classList.toggle("is-open");
      chineseMenuButton.setAttribute("aria-expanded", String(isOpen));
    });

    chineseNav.addEventListener("click", (event) => {
      if (!event.target.closest(".zh-site-links a")) return;
      chineseNav.classList.remove("is-open");
      chineseMenuButton.setAttribute("aria-expanded", "false");
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || !chineseNav.classList.contains("is-open")) {
        return;
      }
      chineseNav.classList.remove("is-open");
      chineseMenuButton.setAttribute("aria-expanded", "false");
      chineseMenuButton.focus();
    });
  }

  const normalizedPath = (value) => {
    const path = new URL(value, window.location.href).pathname;
    return path.replace(/\/index\.html$/, "/").replace(/\.html$/, "").replace(/\/$/, "");
  };

  const currentPath = normalizedPath(window.location.href);
  const navLinks = [
    ...document.querySelectorAll(
      "#quarto-header .navbar-nav a.nav-link, .zh-site-links a"
    ),
  ];

  let activeLink = navLinks.find((link) => link.classList.contains("active"));

  if (!activeLink) {
    activeLink = navLinks.find(
      (link) => normalizedPath(link.href) === currentPath
    );
    activeLink?.classList.add("active");
  }

  if (!activeLink) return;

  requestAnimationFrame(() => {
    const scrollContainer = [
      activeLink.closest(".zh-site-navbar"),
      activeLink.closest(".navbar-nav-scroll"),
      activeLink.closest(".navbar-collapse"),
    ].find(
      (element) => element && element.scrollWidth > element.clientWidth
    );

    if (!scrollContainer) return;

    const linkRect = activeLink.getBoundingClientRect();
    const containerRect = scrollContainer.getBoundingClientRect();
    const targetLeft =
      scrollContainer.scrollLeft +
      linkRect.left -
      containerRect.left -
      (scrollContainer.clientWidth - linkRect.width) / 2;

    scrollContainer.scrollTo({
      left: Math.max(0, targetLeft),
      behavior: "auto",
    });
  });
});
</script>
